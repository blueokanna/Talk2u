name: talk2u
description: "On-device character chat with Live2D, MOSS speech synthesis and Qwen3 on the Qualcomm NPU."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pinned by flutter_localizations; the ARB output does not constrain it itself.
  intl: any

  cupertino_icons: ^2.0.0
  provider: ^6.1.5
  path_provider: ^2.1.6
  file_picker: ^13.4.0
  share_plus: ^13.3.1
  path: ^1.9.1

  # Pinned exactly: `rust/Cargo.toml` asks for 2.13.0, and
  # `rust/src/frb_generated.rs` plus `lib/src/rust/**` were regenerated with the
  # 2.13.0 code generator. The runtime asserts that the generated code and this
  # package share a version, so all of it moves together or not at all.
  flutter_rust_bridge: 2.13.0
  rust_lib_talk2u:
    path: rust_builder

  # Upstream flutter_markdown is discontinued; this is the maintained
  # continuation by Foresight Mobile, with the same MarkdownBody/StyleSheet API.
  flutter_markdown_plus: ^1.0.12
  freezed_annotation: ^3.1.0

  crypto: ^3.0.8
  archive: ^4.7.1
  audioplayers: ^6.8.1
  # 7.2.0 is the current release. Its record_android 2.3.0 buildscript asks for
  # AGP 9.2.1; this tree's Kotlin compile was verified on the current Gradle
  # 8.14/AGP 8.11.1 toolchain. A release build still has to be run with the
  # licensed Cubism SDK present, which is not available on this workstation.
  record: ^7.2.0
  webview_cef:
    path: third_party/webview_cef_linux
  webview_windows: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  # build_runner 2.17.1 resolves build 5.x; freezed 4 accepts it, so the old
  # 2.15 pin that existed for freezed 3 is gone.
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/Talk2U.png
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: assets/Talk2U.png
    icon_size: 48
  macos:
    generate: true
    image_path: assets/Talk2U.png
  image_path: assets/Talk2U.png

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/Talk2U.png
    - assets/fonts/
    - model/Live2d/mao/ReadMe.txt
    - model/Live2d/mao/runtime/
    - model/Live2d/mao/runtime/expressions/
    - model/Live2d/mao/runtime/motions/
    - model/Live2d/mao/runtime/mao_pro.4096/

  fonts:
    # Latin and symbols. OFL 1.1, see assets/fonts/NOTICE.md.
    #
    # One variable file covers wght 100-900. Flutter resolves a requested weight
    # against the declared entries, so the three weights this UI actually uses
    # are declared explicitly against the same asset. Without them a medium or
    # bold Latin run would be synthesised from the 400 face instead of using the
    # variable axis.
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans-Variable.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans-Variable.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-Variable.ttf
          weight: 700
    # CJK fallback for every weight the UI uses. See assets/fonts/NOTICE.md.
    - family: HarmonyOS Sans SC
      fonts:
        - asset: assets/fonts/HarmonyOS_SansSC_Regular.ttf
          weight: 400
        - asset: assets/fonts/HarmonyOS_SansSC_Medium.ttf
          weight: 500
        - asset: assets/fonts/HarmonyOS_SansSC_Bold.ttf
          weight: 700
