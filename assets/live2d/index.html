<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <style>
    html, body, canvas { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    #status { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; color: #7a3e00;
      font: 14px system-ui, sans-serif; text-align: center; background: rgba(255,247,237,.92); }
  </style>
</head>
<body>
  <canvas id="avatar"></canvas>
  <div id="status">正在加载 Live2D 运行时...</div>
  <script>
    const statusEl = document.getElementById('status');
    window.__talk2uPendingStatus = [];
    const report = (type, message, details = {}) => {
      const payload = JSON.stringify({type, message, ...details});
      statusEl.textContent = message;
      statusEl.style.display = type === 'ready' ? 'none' : 'grid';
      if (window.Talk2uNative?.postMessage) {
        Talk2uNative.postMessage(payload);
      } else {
        window.__talk2uPendingStatus.push(payload);
      }
    };
    window.flushTalk2uStatus = () => {
      if (!window.Talk2uNative?.postMessage) return false;
      window.__talk2uPendingStatus.splice(0).forEach(payload =>
        Talk2uNative.postMessage(payload));
      return true;
    };

    const loadScript = (sources, timeoutMs = 15000) => new Promise((resolve, reject) => {
      const remaining = [...sources];
      const failures = [];
      const next = () => {
        const source = remaining.shift();
        if (!source) {
          return reject(new Error(`运行库加载失败: ${failures.join('; ')}`));
        }
        const script = document.createElement('script');
        const timer = setTimeout(() => {
          failures.push(`${source} 超时`);
          script.remove();
          next();
        }, timeoutMs);
        script.src = source;
        script.onload = () => {
          clearTimeout(timer);
          resolve(source);
        };
        script.onerror = event => {
          clearTimeout(timer);
          failures.push(`${source} ${event?.message || '请求失败'}`);
          script.remove();
          next();
        };
        document.head.appendChild(script);
      };
      next();
    });

    const loadJson = url => new Promise((resolve, reject) => {
      const request = new XMLHttpRequest();
      request.open('GET', url, true);
      request.timeout = 15000;
      request.onload = () => {
        if ((request.status >= 200 && request.status < 300) ||
            (request.status === 0 && request.responseText)) {
          try {
            resolve(JSON.parse(request.responseText));
          } catch (error) {
            reject(new Error(`${url} 不是有效 JSON: ${error.message}`));
          }
        } else {
          reject(new Error(`${url} 加载失败 (${request.status})`));
        }
      };
      request.onerror = () => reject(new Error(`${url} 无法读取`));
      request.ontimeout = () => reject(new Error(`${url} 读取超时`));
      request.send();
    });

    const normalize = value => String(value || '')
      .toLowerCase()
      .replace(/[^a-z0-9\u4e00-\u9fff]/g, '');

    const siblingUrl = (base, relative) => new URL(relative, base).href;

    const coreVersion = () => {
      try {
        const encoded = Number(Live2DCubismCore.Version.csmGetVersion()) >>> 0;
        return {
          encoded,
          major: (encoded >>> 24) & 0xff,
          minor: (encoded >>> 16) & 0xff,
          patch: encoded & 0xffff,
        };
      } catch (_) {
        return null;
      }
    };

    const uniqueStrings = values => [...new Set(values.filter(Boolean).map(String))];

    const discoverLipSyncProfile = async (modelUrl, settings, avatarConfig) => {
      const configured = Array.isArray(avatarConfig?.lipSync?.parameterIds)
        ? avatarConfig.lipSync.parameterIds
        : [];
      const configuredVisemes = Array.isArray(avatarConfig?.lipSync?.visemeParameterIds)
        ? avatarConfig.lipSync.visemeParameterIds
        : [];
      const group = (settings.Groups || settings.groups || []).find(item =>
        normalize(item.Name || item.name) === 'lipsync');
      const groupIds = group && (group.Ids || group.ids);
      const grouped = Array.isArray(groupIds) ? groupIds : [];
      const cdiParameterIds = [];
      const mouthOpenIds = [];
      const references = settings.FileReferences || settings.fileReferences || {};
      const displayInfo = references.DisplayInfo || references.displayInfo;
      if (displayInfo) {
        try {
          const cdi = await loadJson(siblingUrl(modelUrl, displayInfo));
          const parameters = cdi.Parameters || cdi.parameters || [];
          parameters.forEach(item => {
            const id = item.Id || item.id;
            const name = normalize(item.Name || item.name);
            if (!id) return;
            cdiParameterIds.push(String(id));
            if (id === 'ParamMouthOpenY' || name === 'mouthopen' || name === '嘴巴开合') {
              mouthOpenIds.push(String(id));
            }
          });
        } catch (_) {}
      }
      const cdiSet = new Set(cdiParameterIds);
      const vowelOrder = ['ParamA', 'ParamI', 'ParamU', 'ParamE', 'ParamO'];
      const discoveredVisemes = vowelOrder.filter(id => cdiSet.has(id));
      const visemeParameterIds = uniqueStrings([
        ...configuredVisemes,
        ...discoveredVisemes,
      ]).filter(id => vowelOrder.includes(id));
      const openParameterIds = uniqueStrings([
        ...configured,
        ...grouped,
        ...mouthOpenIds,
      ]).filter(id => !visemeParameterIds.includes(id));
      const mode = avatarConfig?.lipSync?.mode === 'viseme' || visemeParameterIds.length >= 3
        ? 'viseme'
        : 'open';
      if (mode === 'viseme') {
        return {
          mode,
          parameterIds: visemeParameterIds.length ? visemeParameterIds : ['ParamA'],
          visemeParameterIds: visemeParameterIds.length ? visemeParameterIds : ['ParamA'],
        };
      }
      const parameterIds = openParameterIds.length
        ? openParameterIds
        : ['ParamMouthOpenY', 'ParamA'];
      return {mode, parameterIds, visemeParameterIds: []};
    };

    let model = null;
    let modelSettings = null;
    let avatarConfig = {};
    let lipSyncIds = [];
    let lipSyncProfile = {mode: 'open', parameterIds: [], visemeParameterIds: []};
    let coreParameterIds = new Set();
    let mouthTarget = 0;
    let mouthCurrent = 0;
    let speaking = false;
    let lastMouthSignalAt = 0;
    let speechStartedAt = 0;
    let activeCue = 'neutral';
    let bodyBlend = 0;
    let bodyPhase = Math.random() * Math.PI * 2;
    const bodyState = {
      angleX: 0,
      angleY: 0,
      angleZ: 0,
      bodyX: 0,
      bodyY: 0,
      bodyZ: 0,
      eyeX: 0,
      eyeY: 0,
      shoulder: 0,
      armL: 0,
      armR: 0,
      forearmL: 0,
      forearmR: 0,
      handL: 0,
      handR: 0,
    };
    let expressionResetTimer = null;
    let naturalGazeTimer = null;
    let microExpressionTimer = null;
    let rendererDiagnostics = null;
    let rendererPolicy = null;
    let rendererContextRequest = null;
    let pixiApp = null;
    let contextRecoveryTimer = null;
    let naturalCapabilities = {};
    let cueCoverage = [];
    let invalidConfiguredCues = [];
    let intrinsicModelWidth = 0;
    let intrinsicModelHeight = 0;
    let modelFitReady = false;

    const finiteNumber = (value, fallback, minimum, maximum) => {
      const parsed = Number(value);
      return Number.isFinite(parsed)
        ? Math.max(minimum, Math.min(maximum, parsed))
        : fallback;
    };

    const speechBodyProfile = cue => {
      const profiles = {
        neutral: {tempo: 0.82, headX: 1.4, headY: 0.8, headZ: 1.0, bodyX: 0.7, bodyY: 0.5, bodyZ: 0.7, eyeX: 0.05, eyeY: 0.03, offsetY: 0, offsetZ: 0, pulse: 0.35},
        talking: {tempo: 1.0, headX: 2.4, headY: 1.4, headZ: 1.8, bodyX: 1.3, bodyY: 0.9, bodyZ: 1.1, eyeX: 0.08, eyeY: 0.04, offsetY: 0, offsetZ: 0, pulse: 0.75},
        talkingSoft: {tempo: 0.78, headX: 1.5, headY: 1.0, headZ: 1.2, bodyX: 0.8, bodyY: 0.6, bodyZ: 0.7, eyeX: 0.06, eyeY: 0.04, offsetY: -0.8, offsetZ: -0.5, pulse: 0.42},
        emphasis: {tempo: 1.24, headX: 3.8, headY: 2.8, headZ: 3.0, bodyX: 2.0, bodyY: 1.6, bodyZ: 2.2, eyeX: 0.11, eyeY: 0.06, offsetY: 0.8, offsetZ: 0.8, pulse: 1.35},
        thinking: {tempo: 0.64, headX: 1.4, headY: 1.0, headZ: 2.4, bodyX: 0.7, bodyY: 0.6, bodyZ: 1.0, eyeX: 0.10, eyeY: 0.06, offsetY: -2.2, offsetZ: -1.5, pulse: 0.28},
        dramatic: {tempo: 0.9, headX: 3.2, headY: 2.0, headZ: 2.7, bodyX: 1.8, bodyY: 1.2, bodyZ: 1.8, eyeX: 0.10, eyeY: 0.06, offsetY: -0.4, offsetZ: 0.3, pulse: 1.0},
        happy: {tempo: 1.18, headX: 3.4, headY: 2.4, headZ: 3.0, bodyX: 1.9, bodyY: 1.4, bodyZ: 1.7, eyeX: 0.10, eyeY: 0.05, offsetY: 1.2, offsetZ: 0.8, pulse: 1.2},
        sad: {tempo: 0.58, headX: 1.1, headY: 0.8, headZ: 1.4, bodyX: 0.6, bodyY: 0.5, bodyZ: 0.8, eyeX: 0.04, eyeY: 0.03, offsetY: -3.2, offsetZ: -2.0, pulse: 0.2},
        angry: {tempo: 1.34, headX: 2.8, headY: 1.8, headZ: 2.2, bodyX: 1.7, bodyY: 1.1, bodyZ: 2.0, eyeX: 0.08, eyeY: 0.04, offsetY: 1.0, offsetZ: 1.4, pulse: 1.15},
        shy: {tempo: 0.68, headX: 1.3, headY: 0.8, headZ: 2.0, bodyX: 0.7, bodyY: 0.5, bodyZ: 0.8, eyeX: 0.07, eyeY: 0.04, offsetY: -2.6, offsetZ: -1.2, pulse: 0.3},
        surprise: {tempo: 1.42, headX: 3.0, headY: 3.4, headZ: 2.6, bodyX: 1.6, bodyY: 1.8, bodyZ: 2.0, eyeX: 0.12, eyeY: 0.08, offsetY: 1.8, offsetZ: 1.0, pulse: 1.4},
        greeting: {tempo: 1.12, headX: 3.0, headY: 2.0, headZ: 2.8, bodyX: 1.6, bodyY: 1.2, bodyZ: 1.5, eyeX: 0.09, eyeY: 0.05, offsetY: 0.8, offsetZ: 0.5, pulse: 1.0},
        wave: {tempo: 1.16, headX: 3.2, headY: 2.0, headZ: 3.0, bodyX: 1.8, bodyY: 1.2, bodyZ: 1.6, eyeX: 0.09, eyeY: 0.05, offsetY: 0.8, offsetZ: 0.6, pulse: 1.05},
        nod: {tempo: 0.92, headX: 1.2, headY: 3.2, headZ: 1.2, bodyX: 0.7, bodyY: 1.5, bodyZ: 0.8, eyeX: 0.05, eyeY: 0.05, offsetY: 0.3, offsetZ: 0, pulse: 0.8},
        hug: {tempo: 0.72, headX: 1.8, headY: 1.2, headZ: 2.0, bodyX: 1.0, bodyY: 0.8, bodyZ: 1.0, eyeX: 0.06, eyeY: 0.04, offsetY: -0.8, offsetZ: -0.5, pulse: 0.45},
      };
      return profiles[cue] || profiles.talking;
    };

    const speechGestureProfile = cue => {
      const profiles = {
        neutral: {shoulder: 0.10, armL: 0.06, armR: 0.06, forearmL: 0.04, forearmR: 0.04},
        talking: {shoulder: 0.30, armL: 0.22, armR: -0.18, forearmL: 0.16, forearmR: -0.13},
        talkingSoft: {shoulder: 0.16, armL: 0.10, armR: -0.08, forearmL: 0.07, forearmR: -0.06},
        emphasis: {shoulder: 0.58, armL: 0.48, armR: -0.42, forearmL: 0.40, forearmR: -0.34},
        thinking: {shoulder: -0.12, armL: 0.12, armR: 0.26, forearmL: 0.08, forearmR: 0.30},
        dramatic: {shoulder: 0.42, armL: 0.42, armR: -0.38, forearmL: 0.32, forearmR: -0.30},
        happy: {shoulder: 0.55, armL: 0.46, armR: -0.46, forearmL: 0.38, forearmR: -0.38},
        sad: {shoulder: -0.28, armL: -0.12, armR: 0.10, forearmL: -0.08, forearmR: 0.07},
        angry: {shoulder: 0.45, armL: 0.34, armR: -0.34, forearmL: 0.26, forearmR: -0.26},
        shy: {shoulder: -0.22, armL: 0.20, armR: -0.20, forearmL: 0.24, forearmR: -0.24},
        surprise: {shoulder: 0.72, armL: 0.54, armR: -0.54, forearmL: 0.44, forearmR: -0.44},
        greeting: {shoulder: 0.40, armL: 0.16, armR: 0.62, forearmL: 0.12, forearmR: 0.72},
        wave: {shoulder: 0.46, armL: 0.10, armR: 0.82, forearmL: 0.08, forearmR: 0.92},
        nod: {shoulder: 0.22, armL: 0.12, armR: -0.10, forearmL: 0.08, forearmR: -0.07},
        hug: {shoulder: -0.10, armL: 0.60, armR: -0.60, forearmL: 0.68, forearmR: -0.68},
      };
      return profiles[cue] || profiles.talking;
    };

    const updateSpeechBody = (now, delta) => {
      const behavior = avatarConfig?.naturalBehavior?.speechBody || {};
      const enabled = behavior.enabled !== false;
      const gain = finiteNumber(behavior.gain, 1, 0, 2);
      const smoothing = finiteNumber(behavior.smoothing, 0.14, 0.03, 0.5);
      const targetBlend = speaking && enabled ? gain * 1.18 : 0;
      const blendRate = 1 - Math.pow(0.86, Math.max(0.1, Number(delta) || 1));
      bodyBlend += (targetBlend - bodyBlend) * blendRate;
      const profile = speechBodyProfile(activeCue);
      const gesture = speechGestureProfile(activeCue);
      const elapsed = Math.max(0, now - speechStartedAt) / 1000;
      const phase = elapsed * profile.tempo + bodyPhase;
      const energy = Math.max(0, Math.min(1, mouthCurrent));
      const speechPulse = Math.sin(elapsed * 8.2 + bodyPhase) * energy * profile.pulse;
      const gestureWave = Math.sin(elapsed * 1.42 + bodyPhase * 0.7);
      const gestureAccent = Math.pow(Math.max(0, Math.sin(elapsed * 2.15 + bodyPhase)), 3);
      const gestureEnergy = 0.55 + energy * 0.65;
      const target = {
        angleX: (Math.sin(phase * 1.13) * profile.headX + speechPulse * 0.35) * bodyBlend,
        angleY: (profile.offsetY + Math.sin(phase * 0.71 + 1.3) * profile.headY + speechPulse) * bodyBlend,
        angleZ: (profile.offsetZ + Math.sin(phase * 0.89 + 2.1) * profile.headZ) * bodyBlend,
        bodyX: Math.sin(phase * 0.62 + 0.6) * profile.bodyX * bodyBlend,
        bodyY: (Math.sin(phase * 0.54 + 1.7) * profile.bodyY + speechPulse * 0.35) * bodyBlend,
        bodyZ: (profile.offsetZ * 0.45 + Math.sin(phase * 0.68 + 2.8) * profile.bodyZ) * bodyBlend,
        eyeX: Math.sin(phase * 0.43 + 0.4) * profile.eyeX * bodyBlend,
        eyeY: (Math.sin(phase * 0.37 + 1.1) * profile.eyeY + profile.offsetY * 0.008) * bodyBlend,
        shoulder: (Math.sin(phase * 0.74 + 0.9) * gesture.shoulder + speechPulse * 0.18 + gestureAccent * 0.16) * bodyBlend,
        armL: (Math.sin(phase * 0.52 + 0.2) * 0.30 + gesture.armL + gestureAccent * (0.28 + gestureWave * 0.18) * gestureEnergy) * bodyBlend,
        armR: (Math.sin(phase * 0.48 + 2.4) * 0.30 + gesture.armR - gestureAccent * (0.28 - gestureWave * 0.18) * gestureEnergy) * bodyBlend,
        forearmL: (Math.sin(phase * 0.66 + 1.1) * 0.26 + gesture.forearmL + gestureAccent * (0.34 + gestureWave * 0.12) * gestureEnergy) * bodyBlend,
        forearmR: (Math.sin(phase * 0.62 + 2.7) * 0.26 + gesture.forearmR - gestureAccent * (0.34 - gestureWave * 0.12) * gestureEnergy) * bodyBlend,
        handL: (Math.sin(phase * 1.08 + 0.3) * 0.24 + gestureAccent * (0.35 + gestureWave * 0.2)) * bodyBlend,
        handR: (Math.sin(phase * 1.02 + 2.1) * 0.24 - gestureAccent * (0.35 - gestureWave * 0.2)) * bodyBlend,
      };
      const stateBlend = 1 - Math.pow(1 - smoothing, Math.max(0.1, Number(delta) || 1));
      Object.keys(bodyState).forEach(key => {
        bodyState[key] += (target[key] - bodyState[key]) * stateBlend;
      });
    };

    const addCoreParameter = (core, id, value) => {
      if (Math.abs(value) < 0.0001) return;
      try {
        if (typeof core.addParameterValueById === 'function') {
          core.addParameterValueById(id, value);
        } else if (typeof core.getParameterValueById === 'function' && typeof core.setParameterValueById === 'function') {
          core.setParameterValueById(id, core.getParameterValueById(id) + value);
        }
      } catch (_) {}
    };

    const refreshCoreParameterIds = core => {
      try {
        const ids = core?.getModel?.()?.parameters?.ids || core?._parameterIds || [];
        coreParameterIds = new Set(Array.from(ids, id => String(id)));
      } catch (_) {
        coreParameterIds = new Set();
      }
    };

    const parameterAliases = (name, defaults) => uniqueStrings([
      ...(Array.isArray(avatarConfig?.parameterAliases?.[name])
        ? avatarConfig.parameterAliases[name]
        : []),
      ...defaults,
    ]);

    const resolveCoreParameter = candidates => candidates.find(id => coreParameterIds.has(id)) || null;

    const setNormalizedCoreParameter = (core, id, value) => {
      if (!id || !coreParameterIds.has(id)) return false;
      try {
        const index = core.getParameterIndex(id);
        const minimum = Number(core.getParameterMinimumValue(index));
        const maximum = Number(core.getParameterMaximumValue(index));
        const normalized = Math.max(0, Math.min(1, Number(value) || 0));
        const target = Number.isFinite(maximum) && maximum > 0
          ? normalized * maximum
          : normalized;
        core.setParameterValueById(id, Math.max(Number.isFinite(minimum) ? minimum : 0, target));
        return true;
      } catch (_) {
        return false;
      }
    };

    const addAliasedCoreParameter = (core, name, defaults, value) => {
      const id = resolveCoreParameter(parameterAliases(name, defaults));
      if (id) addCoreParameter(core, id, value);
    };

    const addNormalizedCoreParameter = (core, name, defaults, value, rangeScale = 0.025) => {
      const id = resolveCoreParameter(parameterAliases(name, defaults));
      if (!id || Math.abs(value) < 0.0001) return;
      try {
        const index = core.getParameterIndex(id);
        const minimum = Number(core.getParameterMinimumValue(index));
        const maximum = Number(core.getParameterMaximumValue(index));
        const range = Number.isFinite(minimum) && Number.isFinite(maximum) && maximum > minimum
          ? maximum - minimum
          : 2;
        addCoreParameter(core, id, value * range * rangeScale);
      } catch (_) {}
    };

    const applyLipSync = (core, value, now) => {
      const visibleValue = speaking
        ? Math.pow(Math.max(0, Math.min(1, value)), 0.58)
        : 0;
      if (lipSyncProfile.mode !== 'viseme') {
        lipSyncProfile.parameterIds.forEach(id => setNormalizedCoreParameter(core, id, visibleValue));
        return;
      }
      const order = ['ParamA', 'ParamI', 'ParamU', 'ParamE', 'ParamO']
        .filter(id => lipSyncProfile.visemeParameterIds.includes(id) && coreParameterIds.has(id));
      if (!order.length) {
        lipSyncProfile.parameterIds.forEach(id => setNormalizedCoreParameter(core, id, visibleValue));
        return;
      }
      const phase = Math.max(0, now - speechStartedAt) / 115;
      const currentIndex = Math.floor(phase) % order.length;
      const nextIndex = (currentIndex + 1) % order.length;
      const fraction = phase - Math.floor(phase);
      const blend = 0.5 - Math.cos(fraction * Math.PI) * 0.5;
      order.forEach((id, index) => {
        let weight = 0.035;
        if (index === currentIndex) weight += 0.965 * (1 - blend);
        if (index === nextIndex) weight += 0.965 * blend;
        setNormalizedCoreParameter(core, id, visibleValue * Math.min(1, weight));
      });
    };

    const diagnosticNumber = value => {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : null;
    };

    const getModelGeometryDiagnostics = () => {
      const canvas = pixiApp?.view || document.getElementById('avatar');
      return {
        fitted: modelFitReady,
        visible: model?.visible === true,
        renderable: model?.renderable === true,
        alpha: diagnosticNumber(model?.alpha),
        intrinsicWidth: diagnosticNumber(intrinsicModelWidth),
        intrinsicHeight: diagnosticNumber(intrinsicModelHeight),
        width: diagnosticNumber(model?.width),
        height: diagnosticNumber(model?.height),
        scaleX: diagnosticNumber(model?.scale?.x),
        scaleY: diagnosticNumber(model?.scale?.y),
        positionX: diagnosticNumber(model?.position?.x),
        positionY: diagnosticNumber(model?.position?.y),
        viewportWidth: diagnosticNumber(window.innerWidth),
        viewportHeight: diagnosticNumber(window.innerHeight),
        canvasWidth: diagnosticNumber(canvas?.width),
        canvasHeight: diagnosticNumber(canvas?.height),
      };
    };

    const runtimeSettings = () => model?.internalModel?.settings;

    const availableMotionGroups = () => {
      const motions = runtimeSettings()?.motions || {};
      return Object.keys(motions).filter(group =>
        Array.isArray(motions[group]) && motions[group].length > 0);
    };

    const availableExpressions = () => (runtimeSettings()?.expressions || [])
      .map(item => String(item.Name || item.name || ''))
      .filter(Boolean);

    const resolveMotion = motion => {
      if (!motion || !Object.prototype.hasOwnProperty.call(motion, 'group')) return null;
      const group = String(motion.group);
      const index = Math.max(0, Math.trunc(Number(motion.index) || 0));
      const definitions = runtimeSettings()?.motions?.[group];
      return Array.isArray(definitions) && index < definitions.length ? {group, index} : null;
    };

    const resolveExpression = name => {
      if (!name) return null;
      const requested = normalize(name);
      return availableExpressions().find(item => normalize(item) === requested) || null;
    };

    const expressionManager = () =>
      model?.internalModel?.motionManager?.expressionManager || null;

    const resetExpression = () => {
      if (expressionResetTimer) clearTimeout(expressionResetTimer);
      expressionResetTimer = null;
      const manager = expressionManager();
      if (!manager || typeof manager.resetExpression !== 'function') return false;
      manager.resetExpression();
      return true;
    };

    const playExpression = (name, durationMs) => {
      const resolved = resolveExpression(name);
      if (!resolved || !model) return false;
      model.expression(resolved);
      if (expressionResetTimer) clearTimeout(expressionResetTimer);
      const duration = finiteNumber(
        durationMs,
        finiteNumber(avatarConfig?.naturalBehavior?.expressionDurationMs, 4200, 500, 15000),
        500,
        15000,
      );
      expressionResetTimer = setTimeout(resetExpression, duration);
      return true;
    };

    const resolveConfiguredCue = cue => {
      const configured = avatarConfig?.cues?.[cue];
      if (!configured) return null;
      const motion = resolveMotion(configured.motion);
      const expression = resolveExpression(configured.expression);
      return motion || expression ? {motion, expression, configured} : null;
    };

    const playConfiguredCue = cue => {
      const resolved = resolveConfiguredCue(cue);
      if (!resolved || !model) return false;
      let played = false;
      if (resolved.motion) {
        model.motion(resolved.motion.group, resolved.motion.index, 3);
        played = true;
      }
      if (resolved.expression) {
        playExpression(resolved.expression, resolved.configured.durationMs);
        played = true;
      }
      return played;
    };

    const resolveFallbackCue = cue => {
      if (!model) return null;
      const groups = availableMotionGroups();
      const aliases = {
        neutral: ['idle'],
        talking: ['talking', 'talk', 'idle'],
        talkingSoft: ['talking', 'talk', 'idle'],
        emphasis: ['emphasis', 'talking', 'talk'],
        thinking: ['thinking', 'idle'],
        dramatic: ['dramatic', 'talking', 'talk'],
        greeting: ['greeting', 'hello'],
        wave: ['wave'],
        hug: ['hug', 'embrace'],
        nod: ['nod'],
        happy: ['happy', 'joy', 'smile'],
        sad: ['sad', 'sorrow'],
        angry: ['angry', 'mad'],
        shy: ['shy', 'blush'],
        surprise: ['surprise', 'shock']
      };
      const requested = aliases[cue] || aliases.neutral;
      const group = requested.map(alias => groups.find(item => {
        const value = normalize(item);
        return value === alias || value.includes(alias);
      })).find(item => item !== undefined);

      const expressionAliases = {
        greeting: ['wavearml', 'wavearmr', 'smile', 'happy', 'hearts'],
        wave: ['wavearml', 'wavearmr', 'smile', 'happy'],
        hug: ['shyarml', 'shyarmr', 'hearts', 'smile', 'happy'],
        happy: ['happy', 'smile', 'joy', 'hearts', 'stars', 'ahogeheart'],
        sad: ['sad', 'sorrow', 'pleading', 'faceshadow', 'darkeyecircles'],
        angry: ['angry', 'mad', 'faceshadow', 'hornsbig'],
        shy: ['shyarml', 'shyarmr', 'shy', 'blush', 'pleading'],
        surprise: ['surprise', 'shock', 'spirals', 'stars']
      };
      const expression = availableExpressions().find(item => {
        const name = normalize(item);
        return (expressionAliases[cue] || []).some(alias => name === alias || name.includes(alias));
      }) || null;
      return group || expression ? {motion: group ? {group, index: 0} : null, expression} : null;
    };

    const playFallbackCue = cue => {
      const resolved = resolveFallbackCue(cue);
      if (!resolved || !model) return false;
      if (resolved.motion) model.motion(resolved.motion.group, resolved.motion.index, 3);
      if (resolved.expression) playExpression(resolved.expression);
      return true;
    };

    const calculateCueCoverage = () => {
      const supported = [
        'neutral', 'talking', 'talkingSoft', 'emphasis', 'thinking', 'dramatic',
        'greeting', 'wave', 'hug', 'nod',
        'happy', 'sad', 'angry', 'shy', 'surprise'
      ];
      invalidConfiguredCues = Object.keys(avatarConfig?.cues || {}).filter(cue =>
        !resolveConfiguredCue(cue));
      return supported.filter(cue =>
        Boolean(resolveConfiguredCue(cue) || resolveFallbackCue(cue)));
    };

    const randomBetween = (minimum, maximum) => minimum + Math.random() * (maximum - minimum);

    const scheduleNaturalGaze = () => {
      if (naturalGazeTimer) clearTimeout(naturalGazeTimer);
      const gaze = avatarConfig?.naturalBehavior?.gaze || {};
      if (gaze.enabled === false) return;
      const minimum = finiteNumber(gaze.intervalMinMs, 2600, 800, 30000);
      const maximum = finiteNumber(gaze.intervalMaxMs, 5600, minimum, 60000);
      naturalGazeTimer = setTimeout(() => {
        const controller = model?.internalModel?.focusController;
        if (!document.hidden && controller && typeof controller.focus === 'function') {
          const rangeX = finiteNumber(gaze.rangeX, 0.22, 0, 0.65);
          const rangeY = finiteNumber(gaze.rangeY, 0.12, 0, 0.45);
          controller.focus(randomBetween(-rangeX, rangeX), randomBetween(-rangeY, rangeY));
        }
        scheduleNaturalGaze();
      }, randomBetween(minimum, maximum));
    };

    const scheduleMicroExpression = () => {
      if (microExpressionTimer) clearTimeout(microExpressionTimer);
      const behavior = avatarConfig?.naturalBehavior || {};
      const candidates = Array.isArray(behavior.microExpressions)
        ? behavior.microExpressions.map(resolveExpression).filter(Boolean)
        : [];
      if (!candidates.length) return;
      const minimum = finiteNumber(behavior.microExpressionMinMs, 12000, 3000, 120000);
      const maximum = finiteNumber(behavior.microExpressionMaxMs, 24000, minimum, 180000);
      microExpressionTimer = setTimeout(() => {
        if (!document.hidden && !speaking) {
          playExpression(candidates[Math.floor(Math.random() * candidates.length)], behavior.microExpressionDurationMs);
        }
        scheduleMicroExpression();
      }, randomBetween(minimum, maximum));
    };

    const createWebGlContext = canvas => {
      const forceWebGl1 = sessionStorage.getItem('talk2u-force-webgl1') === '1';
      const attributes = {
        alpha: true,
        antialias: true,
        depth: false,
        stencil: true,
        premultipliedAlpha: true,
        preserveDrawingBuffer: false,
        failIfMajorPerformanceCaveat: true,
        powerPreference: 'high-performance',
      };
      const attempts = forceWebGl1
        ? [{api: 'webgl1', contextName: 'webgl'}]
        : [
            {api: 'webgl2', contextName: 'webgl2'},
            {api: 'webgl1', contextName: 'webgl'},
          ];
      const failures = [];
      for (const attempt of attempts) {
        try {
          const context = canvas.getContext(attempt.contextName, attributes);
          if (context) {
            return {
              context,
              selectedApi: attempt.api,
              forceWebGl1,
              requestedApiOrder: attempts.map(item => item.api),
              failures,
              attributes,
            };
          }
          failures.push(`${attempt.api}: context unavailable`);
        } catch (error) {
          failures.push(`${attempt.api}: ${error.message}`);
        }
      }
      throw new Error(`硬件 WebGL context 创建失败（${failures.join('; ')}）`);
    };

    const installContextRecovery = (canvas, selectedApi) => {
      const recoveryKey = 'talk2u-webgl-recovery-count';
      canvas.addEventListener('webglcontextlost', event => {
        event.preventDefault();
        mouthTarget = 0;
        if (pixiApp) pixiApp.stop();
        const recoveries = Number(sessionStorage.getItem(recoveryKey) || 0);
        report('recovering', 'Live2D 图形上下文丢失，正在等待驱动恢复...', {
          selectedApi,
          recoveries,
        });
        clearTimeout(contextRecoveryTimer);
        contextRecoveryTimer = setTimeout(() => {
          report('error', 'Live2D 图形上下文未能恢复，请点击重试', {
            failureCode: 'webgl-context-restore-timeout',
            recoverable: true,
          });
        }, 10000);
      }, false);

      canvas.addEventListener('webglcontextrestored', () => {
        clearTimeout(contextRecoveryTimer);
        const recoveries = Number(sessionStorage.getItem(recoveryKey) || 0) + 1;
        sessionStorage.setItem(recoveryKey, String(recoveries));
        if (recoveries > 2) {
          report('error', 'Live2D 图形上下文反复丢失，已停止自动恢复', {
            failureCode: 'webgl-context-unstable',
            recoverable: true,
          });
          return;
        }
        if (selectedApi === 'webgl2') {
          sessionStorage.setItem('talk2u-force-webgl1', '1');
        }
        report('loading', selectedApi === 'webgl2'
          ? 'WebGL2 驱动不稳定，正在使用 WebGL1 兼容模式重载...'
          : '图形上下文已恢复，正在重新加载 Live2D...');
        setTimeout(() => location.reload(), 50);
      }, false);
    };

    const detectRenderer = app => {
      const gl = app?.renderer?.gl;
      if (!gl) return {api: 'none', backend: 'unavailable', software: true};
      const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
      const vendor = debugInfo
        ? gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL)
        : gl.getParameter(gl.VENDOR);
      const renderer = debugInfo
        ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL)
        : gl.getParameter(gl.RENDERER);
      const version = gl.getParameter(gl.VERSION);
      const shadingLanguageVersion = gl.getParameter(gl.SHADING_LANGUAGE_VERSION);
      const backendValue = `${vendor || ''} ${renderer || ''}`.toLowerCase();
      const backend = backendValue.includes('vulkan')
        ? 'vulkan-via-angle'
        : backendValue.includes('opengl') || backendValue.includes('gles')
          ? 'opengl-es-via-webgl'
          : backendValue.includes('angle')
            ? 'angle-backend-unspecified'
            : 'webgl-driver-unspecified';
      let platform = {};
      try {
        platform = window.Talk2uNative?.getRendererCapabilities
          ? JSON.parse(Talk2uNative.getRendererCapabilities())
          : {};
      } catch (_) {
        platform = {};
      }
      return {
        api: typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext
          ? 'webgl2'
          : 'webgl1',
        backend,
        vendor: String(vendor || ''),
        renderer: String(renderer || ''),
        version: String(version || ''),
        shadingLanguageVersion: String(shadingLanguageVersion || ''),
        resolution: Number(app?.renderer?.resolution || 1),
        devicePixelRatio: Number(window.devicePixelRatio || 1),
        canvasPixels: {
          width: Number(app?.view?.width || 0),
          height: Number(app?.view?.height || 0),
        },
        software: /swiftshader|llvmpipe|software/.test(backendValue),
        contextRequest: rendererContextRequest ? {
          selectedApi: rendererContextRequest.selectedApi,
          forceWebGl1: rendererContextRequest.forceWebGl1,
          requestedApiOrder: rendererContextRequest.requestedApiOrder,
          failures: rendererContextRequest.failures,
          attributes: rendererContextRequest.attributes,
        } : null,
        platform,
      };
    };

    const evaluateRendererPolicy = diagnostics => {
      const backend = diagnostics?.backend || 'unavailable';
      const platform = diagnostics?.platform || {};
      const usingVulkan = backend === 'vulkan-via-angle';
      const usingOpenGl = backend === 'opengl-es-via-webgl';
      const nativeProbe = platform.nativeProbe || {};
      return {
        preference: 'hardware-webgl2-then-webgl1',
        requestedApiOrder: diagnostics?.contextRequest?.requestedApiOrder || [],
        selectedWebGlApi: diagnostics?.api || 'unavailable',
        backendSelectionOwner: 'Android System WebView / ANGLE',
        deviceAdvertisesVulkan: platform.vulkanAdvertised === true,
        preferredNativeBackend: nativeProbe.preferredNativeBackend || 'unknown',
        actualBackend: backend,
        usingVulkan,
        usingOpenGlFallback: !usingVulkan && usingOpenGl,
        fallbackControlledByApp: false,
        backendVerified: usingVulkan || usingOpenGl,
        nativeProbeIsNotLive2dBackend: true,
        appControlledVulkanFallbackAvailable: false,
        appControlledVulkanFallbackRequirement: 'Cubism SDK for Native 5 renderer',
      };
    };

    window.Talk2UAvatar = {
      setMouth(value) {
        if (!model) return false;
        mouthTarget = Math.max(0, Math.min(1, Number(value) || 0));
        lastMouthSignalAt = performance.now();
        return true;
      },
      setSpeaking(value) {
        const wasSpeaking = speaking;
        speaking = Boolean(value);
        if (speaking && !wasSpeaking) {
          speechStartedAt = performance.now();
          bodyPhase = Math.random() * Math.PI * 2;
          if (activeCue === 'neutral') activeCue = 'talking';
          resetExpression();
        }
        if (!speaking) {
          mouthTarget = 0;
          activeCue = 'neutral';
        }
        return Boolean(model);
      },
      motion(group, index) {
        const resolved = resolveMotion({group, index});
        if (!resolved || !model) return false;
        model.motion(resolved.group, resolved.index, 3);
        return true;
      },
      expression(name) { return playExpression(name); },
      resetExpression,
      perform(cue) {
        const normalizedCue = String(cue || 'neutral');
        activeCue = normalizedCue;
        if (normalizedCue === 'neutral') resetExpression();
        return playConfiguredCue(normalizedCue) || playFallbackCue(normalizedCue);
      },
      diagnostics() {
        return JSON.stringify({
          lipSyncIds,
          coreVersion: coreVersion(),
          cueCoverage,
          invalidConfiguredCues,
          renderer: rendererDiagnostics,
          rendererPolicy,
          naturalCapabilities,
          modelVersion: modelSettings?.Version,
          frameworkVersion: PIXI?.live2d?.VERSION || 'unknown',
          avatarConfig,
          modelGeometry: getModelGeometryDiagnostics(),
        });
      }
    };

    (async () => {
      try {
        const query = new URLSearchParams(location.search);
        const modelUrl = query.get('model');
        if (!modelUrl) throw new Error('未配置 .model3.json 模型路径');

        const runtimeSources = {};
        const coreSources = [];
        if (query.get('localCore') !== '0') {
          coreSources.push('vendor/live2dcubismcore.min.js');
        }
        coreSources.push('https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js');
        runtimeSources.core = await loadScript(coreSources, 42000);
        const version = coreVersion();
        if (!version || version.major < 5) {
          const current = version ? `${version.major}.${version.minor}` : '未知';
          throw new Error(`当前 Cubism Core ${current} 低于模型要求的 5.0`);
        }
        runtimeSources.pixi = await loadScript([
          'vendor/pixi.min.js',
          'https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js'
        ]);
        runtimeSources.framework = await loadScript([
          'vendor/cubism4.min.js',
          'https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js'
        ]);

        modelSettings = await loadJson(modelUrl);
        try {
          avatarConfig = await loadJson(siblingUrl(modelUrl, 'talk2u.avatar.json'));
        } catch (_) {
          avatarConfig = {};
        }
        lipSyncProfile = await discoverLipSyncProfile(modelUrl, modelSettings, avatarConfig);
        lipSyncIds = lipSyncProfile.parameterIds;

        if (PIXI.settings && PIXI.ENV && 'PREFER_ENV' in PIXI.settings) {
          PIXI.settings.PREFER_ENV = PIXI.ENV.WEBGL2;
        }

        const canvas = document.getElementById('avatar');
        const renderResolution = Math.max(
          1,
          Math.min(Number(window.devicePixelRatio) || 1, 3),
        );
        if (PIXI.settings) PIXI.settings.RESOLUTION = renderResolution;
        rendererContextRequest = createWebGlContext(canvas);
        installContextRecovery(canvas, rendererContextRequest.selectedApi);
        pixiApp = new PIXI.Application({
          view: canvas,
          context: rendererContextRequest.context,
          resizeTo: window,
          resolution: renderResolution,
          autoDensity: true,
          backgroundAlpha: 0,
          autoStart: true,
          antialias: true,
          powerPreference: 'high-performance',
          preserveDrawingBuffer: false,
        });
        rendererDiagnostics = detectRenderer(pixiApp);
        rendererPolicy = evaluateRendererPolicy(rendererDiagnostics);
        if (rendererDiagnostics.software) {
          throw new Error('检测到软件 WebGL renderer，拒绝以软件渲染冒充 Vulkan/OpenGL ES');
        }
        model = await PIXI.live2d.Live2DModel.from(modelUrl, {autoInteract: false});
        pixiApp.stage.addChild(model);
        model.visible = true;
        model.renderable = true;
        model.alpha = 1;

        const internalModel = model.internalModel || {};
        refreshCoreParameterIds(internalModel.coreModel);
        naturalCapabilities = {
          idleMotion: availableMotionGroups().some(group => normalize(group) === 'idle'),
          eyeBlink: Boolean(internalModel.eyeBlink),
          breath: Boolean(internalModel.breath),
          physics: Boolean(internalModel.physics),
          pose: Boolean(internalModel.pose),
          gaze: Boolean(internalModel.focusController),
          speechBody: avatarConfig?.naturalBehavior?.speechBody?.enabled !== false,
          visemeLipSync: lipSyncProfile.mode === 'viseme',
          shoulderArmSpeech: [
            ...parameterAliases('shoulder', ['ParamShoulderY', 'ParamBodyAngleZ3']),
            ...parameterAliases('armL', ['ParamArmLA01', 'ParamArmLA', 'Param104']),
            ...parameterAliases('armR', ['ParamArmRA01', 'ParamArmRA', 'Param431']),
            ...parameterAliases('handL', ['ParamHandL', 'Param106']),
            ...parameterAliases('handR', ['ParamHandR', 'Param433']),
          ].some(id => coreParameterIds.has(id)),
        };
        cueCoverage = calculateCueCoverage();

        const gain = Math.max(0.1, Math.min(3, Number(avatarConfig?.lipSync?.gain) || 1));
        const legacySmoothing = finiteNumber(avatarConfig?.lipSync?.smoothing, 0.45, 0.05, 1);
        const attack = finiteNumber(avatarConfig?.lipSync?.attack, Math.max(0.5, legacySmoothing), 0.05, 1);
        const release = finiteNumber(avatarConfig?.lipSync?.release, Math.min(0.35, legacySmoothing), 0.03, 1);
        const staleAfterMs = finiteNumber(avatarConfig?.lipSync?.staleAfterMs, 240, 80, 1000);
        pixiApp.ticker.add(delta => {
          const now = performance.now();
          if (!speaking) {
            mouthTarget = 0;
          } else if (now - lastMouthSignalAt > staleAfterMs) {
            const elapsed = Math.max(0, now - speechStartedAt);
            mouthTarget = 0.12 + Math.abs(Math.sin(elapsed / 118) * Math.cos(elapsed / 263)) * 0.5;
          }
          const smoothing = mouthTarget > mouthCurrent ? attack : release;
          const blend = 1 - Math.pow(1 - smoothing, Math.max(0.1, Number(delta) || 1));
          mouthCurrent += (mouthTarget - mouthCurrent) * blend;
          updateSpeechBody(now, delta);
        });
        internalModel.on('beforeModelUpdate', () => {
          const core = internalModel.coreModel;
          if (!core || !core.setParameterValueById) return;
          const value = Math.max(0, Math.min(1, mouthCurrent * gain));
          applyLipSync(core, value, performance.now());
          addAliasedCoreParameter(core, 'angleX', ['ParamAngleX', 'AngleX'], bodyState.angleX);
          addAliasedCoreParameter(core, 'angleY', ['ParamAngleY', 'AngleY'], bodyState.angleY);
          addAliasedCoreParameter(core, 'angleZ', ['ParamAngleZ', 'AngleZ'], bodyState.angleZ);
          addAliasedCoreParameter(core, 'bodyX', ['ParamBodyAngleX', 'ParamBodyAngleX3', 'Param92'], bodyState.bodyX);
          addAliasedCoreParameter(core, 'bodyY', ['ParamBodyAngleY', 'ParamBodyAngleY2', 'Param93'], bodyState.bodyY);
          addAliasedCoreParameter(core, 'bodyZ', ['ParamBodyAngleZ', 'ParamBodyAngleZ2', 'Param94'], bodyState.bodyZ);
          addAliasedCoreParameter(core, 'eyeX', ['ParamEyeBallX'], bodyState.eyeX);
          addAliasedCoreParameter(core, 'eyeY', ['ParamEyeBallY'], bodyState.eyeY);
          addNormalizedCoreParameter(core, 'shoulder', ['ParamShoulderY', 'ParamBodyAngleZ3'], bodyState.shoulder, 0.050);
          addNormalizedCoreParameter(core, 'armL', ['ParamArmLA01', 'ParamArmLA', 'Param104'], bodyState.armL, 0.065);
          addNormalizedCoreParameter(core, 'armR', ['ParamArmRA01', 'ParamArmRA', 'Param431'], bodyState.armR, 0.065);
          addNormalizedCoreParameter(core, 'forearmL', ['ParamArmLA02', 'ParamArmLB01', 'Param105'], bodyState.forearmL, 0.060);
          addNormalizedCoreParameter(core, 'forearmR', ['ParamArmRA02', 'ParamArmRB01', 'Param432'], bodyState.forearmR, 0.060);
          addNormalizedCoreParameter(core, 'handL', ['ParamHandL', 'Param106'], bodyState.handL, 0.050);
          addNormalizedCoreParameter(core, 'handR', ['ParamHandR', 'Param433'], bodyState.handR, 0.050);
        });

        const fit = () => {
          const viewportWidth = window.innerWidth || canvas.clientWidth || 0;
          const viewportHeight = window.innerHeight || canvas.clientHeight || 0;
          if (!(viewportWidth > 0 && viewportHeight > 0)) return false;

          if (!(intrinsicModelWidth > 0 && intrinsicModelHeight > 0)) {
            try {
              const bounds = model.getLocalBounds();
              const width = Number(bounds?.width);
              const height = Number(bounds?.height);
              if (Number.isFinite(width) && width > 0) intrinsicModelWidth = width;
              if (Number.isFinite(height) && height > 0) intrinsicModelHeight = height;
            } catch (_) {}
          }
          if (!(intrinsicModelWidth > 0 && intrinsicModelHeight > 0)) {
            const scaleX = Math.abs(Number(model.scale?.x)) || 1;
            const scaleY = Math.abs(Number(model.scale?.y)) || 1;
            const width = Number(model.width) / scaleX;
            const height = Number(model.height) / scaleY;
            if (Number.isFinite(width) && width > 0) intrinsicModelWidth = width;
            if (Number.isFinite(height) && height > 0) intrinsicModelHeight = height;
          }
          if (!(intrinsicModelWidth > 0 && intrinsicModelHeight > 0)) return false;

          const scale = Math.min(
            viewportWidth / intrinsicModelWidth,
            viewportHeight / intrinsicModelHeight,
          ) * 0.92;
          if (!(Number.isFinite(scale) && scale > 0)) return false;
          model.scale.set(scale);
          model.anchor.set(0.5, 0.5);
          model.position.set(viewportWidth / 2, viewportHeight / 2);
          model.visible = true;
          model.renderable = true;
          model.alpha = 1;
          modelFitReady = true;
          return true;
        };
        for (let attempt = 0; attempt < 180 && !fit(); attempt += 1) {
          await new Promise(resolve => requestAnimationFrame(resolve));
        }
        if (!modelFitReady) {
          throw new Error('Live2D model geometry or viewport remained unavailable');
        }
        window.addEventListener('resize', fit);
        scheduleNaturalGaze();
        scheduleMicroExpression();
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            mouthTarget = 0;
          } else {
            scheduleNaturalGaze();
            scheduleMicroExpression();
          }
        });
        window.addEventListener('pagehide', () => {
          clearTimeout(contextRecoveryTimer);
          if (naturalGazeTimer) clearTimeout(naturalGazeTimer);
          if (microExpressionTimer) clearTimeout(microExpressionTimer);
          if (expressionResetTimer) clearTimeout(expressionResetTimer);
        });
        setTimeout(() => sessionStorage.removeItem('talk2u-webgl-recovery-count'), 30000);
        report('ready', 'Live2D 已就绪', {
          coreVersion: version,
          lipSyncParameterIds: lipSyncIds,
          runtimeSources,
          cueCoverage,
          invalidConfiguredCues,
          renderer: rendererDiagnostics,
          rendererPolicy,
          naturalCapabilities,
          frameworkVersion: PIXI?.live2d?.VERSION || 'unknown',
          modelGeometry: getModelGeometryDiagnostics(),
        });
      } catch (error) {
        clearTimeout(contextRecoveryTimer);
        try {
          pixiApp?.stop();
        } catch (_) {}
        report('error', `Live2D 无法启动：${error.message}`);
      }
    })();
  </script>
</body>
</html>
