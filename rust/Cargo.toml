[package]
name = "rust_lib_talk2u"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
reqwest = { version = "0.13.4", default-features = false, features = [
    "stream",
    "rustls",
    "json",
    "query",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "time"] }
chrono = { version = "0.4.45", features = ["serde"] }
rsntp = { version = "4.1.2", features = ["chrono"] }
hmac = "0.13.0"
sha2 = "0.11.0"
base64url = "0.1"
uuid = { version = "1.24.0", features = ["v4"] }
futures = { version = "0.3", default-features = false }
rmp-serde = "1"
bincode-next = "3.1.1"
rustglm = { version = "=1.0.0", default-features = false }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 16
strip = true

[dev-dependencies]
proptest = "1.11.0"
tokio-test = "0.4"
tempfile = "3.27.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
