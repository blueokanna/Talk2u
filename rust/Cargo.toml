[package]
name = "rust_lib_talk2u"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time"] }
uuid = { version = "1.24.0", features = ["v4"] }
rustglm = { version = "1.1.0", default-features = false }

courierust = "1.0.9"
rustbinary = { version = "0.1.8", features = ["std", "compact", "derive"] }
nextjson = { version = "0.1.4", features = ["std", "derive"] }
tzcraft = { version = "0.1.2", default-features = false, features = ["std"] }
recurse-x = { version = "0.2.3", default-features = false, features = ["std"] }
rmp-serde = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.22.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.dev]
opt-level = 1

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
